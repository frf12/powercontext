# Production configuration for smartmem
database:
  provider: "postgres"
  config:
    host: "${POSTGRES_HOST}"
    port: 5432
    database: "${POSTGRES_DATABASE}"
    username: "${POSTGRES_USERNAME}"
    password: "${POSTGRES_PASSWORD}"
    ssl_mode: "require"
    pool_size: 20
    max_overflow: 30

# LLM configuration
llm:
  provider: "openai"
  config:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    temperature: 0.3
    max_tokens: 2000

# Embedding configuration
embedding:
  provider: "openai"
  config:
    api_key: "${OPENAI_API_KEY}"
    model: "text-embedding-ada-002"

# Intelligent memory configuration
intelligent_memory:
  enabled: true
  initial_retention: 1.0
  decay_rate: 0.05
  reinforcement_factor: 0.4
  working_threshold: 0.4
  short_term_threshold: 0.7
  long_term_threshold: 0.9

# Telemetry configuration
telemetry:
  enabled: true
  endpoint: "https://telemetry.smartmem.ai"
  api_key: "${TELEMETRY_API_KEY}"
  batch_size: 500
  flush_interval: 60

# Audit configuration
audit:
  enabled: true
  log_file: "/var/log/smartmem/audit.log"
  log_level: "WARNING"
  retention_days: 365

# Security configuration
security:
  secret_key: "${SECRET_KEY}"
  jwt_secret: "${JWT_SECRET}"
  encryption_key: "${ENCRYPTION_KEY}"

# Performance configuration
performance:
  max_workers: 8
  cache_ttl: 3600
  batch_size: 200
  timeout: 60

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/var/log/smartmem/smartmem.log"
