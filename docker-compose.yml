version: '3.8'

services:
  powermem:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql://root:password@oceanbase:2881/powermem
    depends_on:
      - oceanbase
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  oceanbase:
    image: oceanbase/oceanbase-ce:4.3.5.0
    environment:
      - OB_ROOT_PASSWORD=password
      - OB_CLUSTER_NAME=powermem
      - OB_TENANT_NAME=powermem
      - OB_TENANT_MODE=mysql
    volumes:
      - oceanbase_data:/root/ob
    ports:
      - "2881:2881"
      - "2882:2882"
      - "2883:2883"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - powermem
    restart: unless-stopped

volumes:
  oceanbase_data:
