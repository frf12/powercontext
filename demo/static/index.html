<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小忆 · PowerContext 记忆体验</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --card: #1c212c; --line: #2a3040;
    --text: #e8eaf0; --dim: #8b93a7; --accent: #7c9aff; --warm: #ffb86b; --ok: #7ce38b; --bad: #ff8b8b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 16px; margin: 0; }
  header h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
          padding: 2px 10px; color: var(--dim); }
  .spacer { flex: 1; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
            font-weight: 600; color: var(--warm); }
  .switch.off { color: var(--dim); }
  .switch input { display: none; }
  .track { width: 44px; height: 24px; border-radius: 999px; background: #3a4152;
           position: relative; transition: background .2s; flex: none; }
  .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
          background: #fff; transition: left .2s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .knob { left: 23px; }
  .switch.disabled { opacity: .5; cursor: default; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit;
           transition: border-color .15s, background .15s, opacity .15s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.mini { padding: 2px 10px; font-size: 12px; }
  button.primary { background: #2b3a5e; border-color: #3d5185; }
  button.primary:hover:not(:disabled) { background: #33456f; border-color: var(--accent); }
  #toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
            display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: var(--card); border: 1px solid var(--accent); color: var(--text);
           padding: 8px 16px; border-radius: 10px; font-size: 13px;
           box-shadow: 0 6px 24px rgba(0, 0, 0, .4); animation: fadein .25s ease-out;
           transition: opacity .3s; max-width: 70vw; }
  .toast.bad { border-color: var(--bad); }
  .toast.out { opacity: 0; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex;
          align-items: center; justify-content: center; z-index: 10; }
  .gatebox { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
             padding: 32px; width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .gatebox h2 { margin: 0; font-size: 18px; }
  .gatebox p { margin: 0; color: var(--dim); font-size: 13px; }
  input, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
                    color: var(--text); padding: 8px 10px; font: inherit; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input:disabled, textarea:disabled { opacity: .6; }
  #main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  /* minmax(0,1fr) 把唯一的隐式行钉在容器高内: 否则 auto 行随内容增长,
     几轮对话后 header 连同开关/新会话被永久挤出视口 */
  #cols { flex: 1; display: grid; grid-template-columns: 1fr 360px; grid-template-rows: minmax(0, 1fr); min-height: 0; }
  #chat { display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2b3a5e; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.error { color: var(--bad); font-size: 13px; border-color: #5a3038; }
  .msg.bot.streaming::after { content: "▍"; color: var(--accent); margin-left: 2px;
                              animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .divider { align-self: center; color: var(--dim); font-size: 12px; background: var(--panel);
             border-radius: 999px; padding: 2px 12px; }
  .divider .on { color: var(--accent); }
  .divider .off { color: var(--dim); }
  details.recall { align-self: flex-start; max-width: 78%; color: var(--dim); font-size: 12px; }
  details.recall summary { cursor: pointer; color: var(--warm); user-select: none; }
  details.recall summary:hover { color: var(--text); }
  details.recall .hit { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  details.recall .hit:last-child { border-bottom: none; }
  details.recall .score { color: var(--dim); margin-left: 6px; }
  #composer { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line);
              background: var(--panel); flex: none; }
  #composer textarea { flex: 1; resize: none; height: 44px; }
  #panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; }
  #panel h3 { font-size: 13px; color: var(--dim); margin: 14px 0 8px; text-transform: uppercase;
              letter-spacing: .05em; }
  #panel h3:first-child { margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 12px; margin-bottom: 8px; transition: border-color .15s; }
  .card:hover { border-color: #3a4356; }
  .card .meta { color: var(--dim); font-size: 11px; display: flex; gap: 8px; align-items: center; }
  .card .text { margin: 4px 0 6px; }
  .card .ops { display: flex; gap: 6px; }
  .card.fade-in, .logitem.fade-in, .toast { animation: fadein .6s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }
  .logitem { font-size: 12px; color: var(--dim); border-left: 2px solid var(--line);
             padding: 2px 0 2px 8px; margin-bottom: 6px; }
  .logitem b { color: var(--text); font-weight: 600; }
  .logitem .new { color: var(--ok); }
  .logitem.error { color: var(--bad); border-left-color: var(--bad); }
  .empty { color: var(--dim); font-size: 12px; }
  .footnote { color: var(--dim); font-size: 12px; margin-top: 18px; padding-top: 12px;
              border-top: 1px dashed var(--line); line-height: 1.7; }
  @media (max-width: 860px) {
    #cols { grid-template-columns: 1fr; }
    #panel { display: none; }
  }
  @media (min-width: 1600px) {
    body { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="toasts"></div>

<div id="gate">
  <form class="gatebox" id="gateForm">
    <h2>小忆 · 记忆体验</h2>
    <p>输入现场公布的口令和一个昵称开始。你的记忆会保存在昵称名下，换个昵称就是换个新用户。</p>
    <input id="passphrase" type="password" placeholder="口令" autocomplete="off">
    <input id="nickname" placeholder="昵称（中文或字母）" maxlength="32" autocomplete="off">
    <button type="submit" class="primary" id="gateSubmit">进入</button>
    <p id="gateError" style="color: var(--bad)"></p>
  </form>
</div>

<div id="main" hidden>
  <header>
    <h1>小忆<small>PowerContext 记忆体验</small></h1>
    <span class="chip" id="nickChip"></span>
    <span class="spacer"></span>
    <label class="switch" id="switchLabel">
      <input type="checkbox" id="memorySwitch" checked>
      <span class="track"><span class="knob"></span></span>
      <span id="switchText">记忆开启 🔥</span>
    </label>
    <button id="newSession">新会话</button>
  </header>
  <div id="cols">
    <section id="chat">
      <div id="messages"></div>
      <form id="composer">
        <textarea id="input" placeholder="跟小忆聊聊你自己，比如你的口味、爱好、工作……"></textarea>
        <button id="send" type="submit" class="primary">发送</button>
      </form>
    </section>
    <aside id="panel">
      <h3>我的记忆</h3>
      <div id="entries"><p class="empty">还没有记忆，先跟小忆聊聊你自己吧</p></div>
      <h3>召回日志</h3>
      <div id="recallLog"><p class="empty">暂无</p></div>
      <h3>写入日志</h3>
      <div id="writeLog"><p class="empty">暂无</p></div>
      <p class="footnote">真实接入：PowerContext 提供 MCP / CLI / SDK 集成，任何 Agent 都能直接调用这些记忆能力。</p>
    </aside>
  </div>
</div>

<script>
const state = { nickname: "", memoryOn: true, messages: [], known: new Set(), busy: false };

// 一整轮聊天(召回+生成+后台写入)的兜底上限, 超过判定为连接超时
const CHAT_TIMEOUT_MS = 8 * 60 * 1000;

const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function toast(text, kind) {
  const item = el("div", "toast" + (kind === "bad" ? " bad" : ""), text);
  $("toasts").append(item);
  setTimeout(() => {
    item.classList.add("out");
    setTimeout(() => item.remove(), 350);
  }, 3200);
}

function nearBottom() {
  const box = $("messages");
  return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
}

function scrollBottom() {
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

async function init() {
  try {
    const resp = await fetch("/api/session");
    if (resp.ok) {
      const data = await resp.json();
      state.nickname = data.nickname;
      $("gate").hidden = true;
      $("main").hidden = false;
      $("nickChip").textContent = state.nickname;
      await refreshEntries();
      $("input").focus();
    }
  } catch (e) { /* stay on gate */ }
}

$("gateForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("gateError").textContent = "";
  $("gateSubmit").disabled = true;
  try {
    const resp = await fetch("/api/enter", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passphrase: $("passphrase").value, nickname: $("nickname").value.trim() }),
    });
    if (!resp.ok) {
      $("gateError").textContent = resp.status === 401 ? "口令不对"
        : resp.status === 422 ? "昵称无效，换一个试试" : "进入失败，请重试";
      return;
    }
    location.reload();
  } catch (e) {
    $("gateError").textContent = "网络异常，请重试";
  } finally {
    $("gateSubmit").disabled = false;
  }
});

function setSwitch(on) {
  state.memoryOn = on;
  $("switchText").textContent = on ? "记忆开启 🔥" : "记忆关闭 ❄️";
  $("switchLabel").classList.toggle("off", !on);
}

$("memorySwitch").addEventListener("change", (event) => {
  const on = event.target.checked;
  setSwitch(on);
  const divider = el("div", "divider");
  divider.append(on ? "记忆已开启 " : "记忆已关闭 ");
  divider.append(el("span", on ? "on" : "off", on ? "🔥 小忆可以想起你" : "❄️ 小忆不认识你"));
  $("messages").append(divider);
  scrollBottom();
});

$("newSession").addEventListener("click", () => {
  if (state.busy) { toast("等小忆说完再开新会话"); return; }
  state.messages = [];
  $("messages").innerHTML = "";
  const divider = el("div", "divider", "—— 新会话：聊天记录已清空，但小忆的记忆还在 ——");
  $("messages").append(divider);
  scrollBottom();
  $("input").focus();
});

function lastUserText() {
  const mine = state.messages.filter((m) => m.role === "user");
  return mine.length ? mine[mine.length - 1].content : "";
}

function renderRecall(hits) {
  const details = el("details", "recall");
  const summary = el("summary", "", `📎 本次召回了 ${hits.length} 条记忆`);
  details.append(summary);
  for (const hit of hits) {
    const row = el("div", "hit");
    row.append(document.createTextNode(hit.text));
    row.append(el("span", "score", (hit.score ?? 0).toFixed(2)));
    details.append(row);
  }
  const log = $("recallLog");
  log.querySelector(".empty")?.remove();
  const item = el("div", "logitem");
  item.append(el("b", "", `「${lastUserText().slice(0, 24)}」召回了 ${hits.length} 条`));
  log.prepend(item);
  return details;
}

function logRecallError(message) {
  const log = $("recallLog");
  log.querySelector(".empty")?.remove();
  log.prepend(el("div", "logitem error", "⚠️ 召回失败：" + String(message || "").slice(0, 80)));
}

// 永不抛错: flushed 触发的刷新失败不能把已完成回合的气泡改写成错误;
// 返回 false 让调用方(如 retire/revise 之后)恢复按钮状态
async function refreshEntries() {
  try {
    const resp = await fetch("/api/memory/entries");
    if (!resp.ok) return false;
    const { entries } = await resp.json();
    const holder = $("entries");
    holder.innerHTML = "";
    if (!entries.length) {
      holder.append(el("p", "empty", "还没有记忆，先跟小忆聊聊你自己吧"));
      return true;
    }
    const added = [];
    for (const entry of entries) {
      const fresh = !state.known.has(entry.entry_id);
      if (fresh) {
        state.known.add(entry.entry_id);
        if (state.messages.length) added.push(entry.text);
      }
      holder.append(renderCard(entry, fresh));
    }
    if (added.length) {
      const log = $("writeLog");
      log.querySelector(".empty")?.remove();
      const item = el("div", "logitem fade-in");
      item.append(el("span", "new", `新写入 ${added.length} 条：`));
      item.append(document.createTextNode(added.join("；")));
      log.prepend(item);
    }
    return true;
  } catch (e) {
    return false;
  }
}

// retire/revise 的统一错误契约: 409 = 引用已过期(已被改过) -> 友好提示并刷新;
// 其余失败 -> toast 展示后端 detail; 网络异常 -> toast
async function postMemory(path, body) {
  let resp;
  try {
    resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (e) {
    toast("网络异常，请重试", "bad");
    return "net";
  }
  if (resp.status === 409) {
    toast("这条记忆刚被修改过，已为你刷新");
    return "conflict";
  }
  if (!resp.ok) {
    let detail = "";
    try { detail = (await resp.json()).detail || ""; } catch (e) { /* non-JSON body */ }
    toast("操作失败：" + (detail || `HTTP ${resp.status}`), "bad");
    return "error";
  }
  return "ok";
}

// ok = 操作成功; conflict = 409 已被别人改过; 两种情况都要刷新面板;
// 刷新本身失败时同样恢复按钮, 否则卡片的操作会被永久锁死
async function applyMemoryOp(path, body, retireBtn, reviseBtn) {
  retireBtn.disabled = true;
  reviseBtn.disabled = true;
  const result = await postMemory(path, body);
  const refreshed = (result === "ok" || result === "conflict") ? await refreshEntries() : false;
  if (!refreshed) { retireBtn.disabled = false; reviseBtn.disabled = false; }
}

function renderCard(entry, fresh) {
  const card = el("div", "card" + (fresh ? " fade-in" : ""));
  const meta = el("div", "meta");
  meta.append(el("span", "", entry.kind || "fact"));
  meta.append(el("span", "", `v${entry.version}`));
  card.append(meta);
  card.append(el("div", "text", entry.text));
  const ops = el("div", "ops");
  const retireBtn = el("button", "mini", "遗忘");
  const reviseBtn = el("button", "mini", "修改");
  retireBtn.addEventListener("click", async () => {
    if (!confirm("让小忆忘掉这条记忆？")) return;
    await applyMemoryOp("/api/memory/retire", entry, retireBtn, reviseBtn);
  });
  reviseBtn.addEventListener("click", async () => {
    const text = prompt("修改这条记忆", entry.text);
    if (!text || text === entry.text) return;
    await applyMemoryOp("/api/memory/revise", { ...entry, kind: entry.kind, text }, retireBtn, reviseBtn);
  });
  ops.append(retireBtn, reviseBtn);
  card.append(ops);
  return card;
}

$("composer").addEventListener("submit", (event) => { event.preventDefault(); send(); });
$("input").addEventListener("input", () => {
  const node = $("input");
  node.style.height = "auto";
  node.style.height = Math.max(44, Math.min(node.scrollHeight, 120)) + "px";
});
// 中文输入法组词中的 Enter 是选字/上屏, 不是发送
$("input").addEventListener("keydown", (event) => {
  if (event.isComposing || event.keyCode === 229) return;
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});

function setBusy(busy) {
  state.busy = busy;
  $("send").disabled = busy;
  $("input").disabled = busy;
  // 流式期间锁定记忆开关: 中途切换对进行中的这一轮不生效, 只会让对比演示更困惑
  $("memorySwitch").disabled = busy;
  $("switchLabel").classList.toggle("disabled", busy);
}

async function send() {
  const text = $("input").value.trim();
  if (!text || state.busy) return;
  setBusy(true);
  $("input").value = "";
  $("input").style.height = "";
  state.messages.push({ role: "user", content: text });
  $("messages").append(el("div", "msg user", text));
  scrollBottom();
  const bubble = el("div", "msg bot streaming", "");
  $("messages").append(bubble);
  let terminated = false;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), CHAT_TIMEOUT_MS);
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: state.messages, memory_on: state.memoryOn }),
      signal: controller.signal,
    });
    if (resp.status === 401) {
      terminated = true;
      bubble.textContent = "（会话已过期，请刷新页面重新进入）";
      return;
    }
    if (!resp.ok || !resp.body) {
      let detail = "";
      try { detail = (await resp.json()).detail || ""; } catch (e) { /* non-JSON body */ }
      throw new Error(detail || `HTTP ${resp.status}`);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx).replace(/\r$/, "");
        buffer = buffer.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        let event;
        try { event = JSON.parse(chunk.slice(6)); } catch (e) { continue; }
        if (event.type === "recall") {
          const stick = nearBottom();
          bubble.before(renderRecall(event.hits || []));
          if (stick) scrollBottom();
        } else if (event.type === "recall_error") {
          logRecallError(event.message);
        } else if (event.type === "delta") {
          const stick = nearBottom();
          bubble.textContent += event.text;
          if (stick) scrollBottom();
        } else if (event.type === "error") {
          terminated = true;
          if (!bubble.textContent) bubble.classList.add("error");
          bubble.textContent += (bubble.textContent ? "\n" : "") + `（${event.message}）`;
        } else if (event.type === "write_error") {
          const log = $("writeLog");
          log.querySelector(".empty")?.remove();
          log.prepend(el("div", "logitem error", "⚠️ 本回合写入失败：" + String(event.message || "").slice(0, 80)));
        } else if (event.type === "done") {
          terminated = true;
          state.messages.push({ role: "assistant", content: event.reply });
        } else if (event.type === "flushed") {
          await refreshEntries();
        }
      }
    }
    if (!terminated) {
      bubble.textContent += (bubble.textContent ? "\n" : "") + "（连接中断，请重试）";
    }
  } catch (err) {
    const note = err && err.name === "AbortError" ? "（连接超时，请重试）" : `（出错了：${err.message}）`;
    bubble.textContent += (bubble.textContent ? "\n" : "") + note;
  } finally {
    clearTimeout(timeout);
    bubble.classList.remove("streaming");
    setBusy(false);
    // 用户往上翻看旧消息时不要强行拽回底部
    if (nearBottom()) scrollBottom();
    $("input").focus();
  }
}

setSwitch(true);
init();
$("passphrase").focus();
</script>
</body>
</html>
