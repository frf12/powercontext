<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-label="CodeGraph, Steering and Memory"><rect width="1280" height="270" rx="18" fill="#f5f7fc"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif"><rect x="30" y="25" width="396" height="220" rx="14" fill="white" stroke="#e2e7f0"/><rect x="52" y="47" width="44" height="36" rx="9" fill="#7185ed"/><text x="74" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="white">01</text><text x="52" y="124" font-size="29" font-weight="700" fill="#162440">CodeGraph</text><text x="52" y="165" font-size="23" fill="#34445d">找到相关代码</text><text x="52" y="207" font-size="17" fill="#6d7b91">仓库快照 · 新鲜度校验</text><rect x="451" y="25" width="396" height="220" rx="14" fill="white" stroke="#e2e7f0"/><rect x="473" y="47" width="44" height="36" rx="9" fill="#258577"/><text x="495" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="white">02</text><text x="473" y="124" font-size="29" font-weight="700" fill="#162440">Steering</text><text x="473" y="165" font-size="23" fill="#34445d">让每一步更聚焦</text><text x="473" y="207" font-size="17" fill="#6d7b91">定向读取 · 合并操作 · 聚焦验证</text><rect x="872" y="25" width="396" height="220" rx="14" fill="white" stroke="#e2e7f0"/><rect x="894" y="47" width="44" height="36" rx="9" fill="#9a6dc8"/><text x="916" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="white">03</text><text x="894" y="124" font-size="29" font-weight="700" fill="#162440">Memory</text><text x="894" y="165" font-size="23" fill="#34445d">让经验留到下一次</text><text x="894" y="207" font-size="17" fill="#6d7b91">保存决定 · 按需召回</text></g></svg>